[project]
name = "windgen"
version = "0.1.0"
description = "Conversational, interactive algorithm lessons"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.28", "python-dotenv>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
windgen = "windgen.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windgen"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
